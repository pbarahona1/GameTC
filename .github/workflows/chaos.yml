# Prueba de caos semanal: bots con decisiones aleatorias en todos los sistemas durante
# 20 años de juego con 50 semillas. Cada fin de mes exige invariantes contables,
# Δ patrimonio = resultado y conciliación del flujo de caja. Solo lectura: no publica nada.
name: Prueba de caos
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run chaos
