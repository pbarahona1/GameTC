# Compila la APK de depuración en GitHub (no hace falta instalar Android Studio).
# Subí el proyecto a un repositorio, entrá a Actions → "APK Android" → Run workflow,
# y descargá la APK desde los artefactos de la ejecución.
#
# No usa android-actions/setup-android: la imagen de GitHub (ubuntu-24.04) ya trae
# el SDK de Android instalado en $ANDROID_HOME, con las licencias aceptadas.
name: APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: SDK de Android preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "No se encontró el SDK de Android en el runner"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-realistic-tycoon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
