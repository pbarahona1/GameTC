# Compila la APK de depuración en GitHub (no hace falta instalar Android Studio).
# Subí el proyecto a un repositorio, entrá a Actions → "APK Android" → Run workflow,
# y descargá la APK desde los artefactos de la ejecución.
name: APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-realistic-tycoon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
